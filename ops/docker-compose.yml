services:
  verdaccio:
    image: verdaccio/verdaccio:6.5
    container_name: verdaccio
    restart: unless-stopped
    ports:
      - "4873:4873"
    volumes:
      - verdaccio_storage:/verdaccio/storage
    profiles:
      - "verdaccio"

  postgres:
    image: postgres:16-alpine
    container_name: box-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: box-db
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles:
      - backend
      - db

    box-bff:
      build:
        context: ./apps/box-bff
        # dev -> MUST use `env:dev`, or frontend (public/) not shown
        # debug | production -> MUST use `env:stg`
        target: dev
      container_name: box-bff
      restart: unless-stopped
      env_file: ./apps/box-bff/.env
      volumes:
        - ./apps/box-bff:/app

volumes:
  verdaccio_storage:
  postgres_data:
