# HTTPS reverse proxy fronting box-bff (Elysia) and Keycloak.
#
#   /bff/*  ->  box-bff:7860     (prefix stripped)
#   /kc/*   ->  keycloak:8080    (prefix preserved; Keycloak is told to live
#                                 at /kc via KC_HTTP_RELATIVE_PATH so all the
#                                 absolute URLs it emits in HTML/JS are correct)
#
# Cert paths point at a Let's Encrypt cert that the bundled certbot will
# issue on container start (and renew automatically thereafter). For local
# `docker compose` testing, set USE_LOCAL_CA=1 on the nginx service — the
# image will then issue a self-signed cert for `server_name` instead of
# hitting Let's Encrypt.
server {
    listen      443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name test1.boobareth.com;

    ssl_certificate         /etc/letsencrypt/live/test1.boobareth.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/test1.boobareth.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/test1.boobareth.com/chain.pem;
    ssl_dhparam             /etc/letsencrypt/dhparams/dhparam.pem;

    # Shared proxy headers. Keycloak is configured with KC_PROXY_HEADERS=xforwarded
    # — these are the headers it reads to learn the original scheme/host/IP.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # Trailing slash on proxy_pass strips the /bff/ prefix, so the bff sees
    # `/api/v1/...` (its native routes) rather than `/bff/api/v1/...`.
    location /bff/ {
        proxy_pass http://box-bff:7860/;
    }

    # NO trailing slash on proxy_pass — the /kc prefix is preserved end-to-end
    # because Keycloak runs with KC_HTTP_RELATIVE_PATH=/kc.
    location /kc/ {
        proxy_pass http://keycloak:8080;
    }

    location = / {
        return 404;
    }
}
