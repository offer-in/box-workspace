# Plain-HTTP reverse proxy. Always loaded — has no SSL file dependencies, so
# the jonasal/nginx-certbot startup script will NOT disable this file even
# when certs haven't been issued yet.
#
# Routes the same way as the HTTPS server in proxy-tls.conf:
#   /bff/*  ->  box-bff:7860   (prefix stripped)
#   /kc/*   ->  keycloak:8080  (prefix preserved; matches KC_HTTP_RELATIVE_PATH=/kc)
#
# server_name is explicit so this server block takes priority over the image's
# port-80 default_server (which 301-redirects everything to HTTPS) for these
# specific hostnames. Add more hostnames here if you want to test from
# other origins.
server {
    listen      80;
    listen [::]:80;
    server_name localhost 127.0.0.1 test1.boobareth.com;

    # Don't shadow certbot's HTTP-01 challenge path — let the image's default
    # ACME location handler serve those by deferring to /var/www/letsencrypt.
    location /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/letsencrypt;
    }

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    location /bff/ {
        proxy_pass http://box-bff:7860/;
    }

    location /kc/ {
        proxy_pass http://keycloak:8080;
    }

    location = / {
        return 404;
    }
}
